# =====================================================================================
# home-lab-setup CI — Phase 16, Part 4: ship to the Docker Swarm lab cluster.
#
# This file adds NO deploy logic. It is a WRAPPER around
# education/docker-swarm/scripts/deploy_swarm.sh, which was written in Part 3 and run by
# hand first, on purpose.
#
#   The script owns : registry login, `docker stack deploy`, convergence polling, the
#                     three smoke gates, and the rollback decision.
#   The wrapper owns: WHEN it runs, WHO may run it, WHERE the secret comes from,
#                     WHICH host it targets, and who gets told.
#
# Recorded claim for Phase 17 (Jenkins) to test: if a second CI system forces a change
# to deploy_swarm.sh, the boundary above was drawn in the wrong place.
#
# 🚨 This project is NOT Capricorn. `deploy_qa` and `deploy_prod_local` live in
#    production/capricorn and are never touched from here (phase16 hard rule B1).
#    deploy_qa fires on every `develop` push; deploy_prod_local serves real production.
# =====================================================================================

# -------------------------------------------------------------------------------------
# Gate 1 of 2 — does a pipeline get CREATED at all?
#
# ⚠️ NOT optional polish. ./push_gitlab.sh snapshots this repo to gitlab/main constantly
# as a backup, and CI is already enabled on the project, so without this guard every
# backup push would spawn a pipeline. Worse than noise: it would bury the deliberate
# ones in a list of accidental ones.
#
# `web` means a human clicked "Run pipeline" in the UI. A push matches nothing and
# creates nothing at all — not a blocked pipeline, not an entry in the list.
#
# ⚠️ The guard had to exist in the FIRST version of this file written TO DISK, not
# merely in the first commit: push_gitlab.sh stages the working tree with `git add -f -A`
# (tracked AND ignored), so a file is live on gitlab/main the moment it is saved.
# -------------------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - deploy

variables:
  # Not secrets, so they live HERE and not in CI settings. A non-secret hidden in the
  # settings UI is invisible to review, invisible to a fresh clone, and invisible to
  # whoever is reading this job log at 3am wondering which host it touched.
  REGISTRY: gitlab.gothamtechnologies.com:5050
  REG_USER: swarm-lab-pull

  SWARM_USER: agamache

  # ✅ TRAP C4 — SPRUNG Aug 19, then fixed here. History, because the before matters:
  #
  #     SWARM_HOST: 192.168.1.191      # one manager, by IP
  #
  # The control plane was HA (3 managers, quorum 2); this delivery path was not. `qm stop
  # 191` and the job died on its first command — `Host is unreachable`, exit 255 — while
  # the cluster held quorum, elected a new leader, and kept serving the UI. ⭐ The lesson
  # is not "don't hardcode an IP". It is that HA is a property of a SPECIFIC PATH, and the
  # deploy path is a path nobody thinks to include in the HA review.
  #
  # 🚨 And it had a second head nobody designed: `.191` was chosen because it was "the
  # first manager", and postgres is PINNED to `.191` (decision A3). Two independent single
  # points of failure landed on the same host, so one `qm stop` took out the deploy path
  # AND the database. Neither decision was wrong; their INTERSECTION was.
  SWARM_HOSTS: "192.168.1.191 192.168.1.192 192.168.1.193"

  # deploy_swarm.sh resolves the manifest RELATIVE TO ITSELF:
  #   $(dirname $BASH_SOURCE)/../manifests/capricorn.stack.yml
  # so the wrapper must reproduce that SHAPE on the remote host. Copying both files flat
  # and passing STACK_FILE=... would "work" and would also fire the script's
  # NON-DEFAULT STACK FILE banner on every routine deploy — a precondition check that
  # exists because a drill was once voided by nobody noticing an override. Making it fire
  # every time turns a working alarm into wallpaper.
  REMOTE_DIR: /home/agamache/swarm-ci

deploy_swarm:
  stage: deploy

  # Pinned explicitly rather than inheriting the runner's default, so a config.toml edit
  # on .182 cannot silently change this job's toolchain.
  # ⭐ Verified Aug 19: docker:24.0 (Alpine 3.20) already ships /usr/bin/ssh and
  # /usr/bin/scp — the Docker CLI supports ssh:// connection contexts, so it must. Hence
  # no `apk add openssh-client`, unlike Capricorn's alpine:latest jobs.
  image: docker:24.0
  tags:
    - docker

  # Gate 2 of 2 — does the job RUN inside a pipeline that exists?
  #
  # Kept even though gate 1 already means only a human can create the pipeline: the job's
  # safety must not DEPEND on the workflow guard staying in place. A `workflow:` block is
  # exactly the kind of thing a later session relaxes to "make CI work again".
  when: manual

  environment:
    name: swarm-lab
    # ⚠️ KNOWN RESIDUAL, deliberately left: this URL is still single-homed. `environment:`
    # is resolved when the job STARTS, from static variables, so it cannot name whichever
    # manager the loop below ends up choosing. Any node serves the app via the routing mesh,
    # so this link works whenever `.192` is up — and breaks when it isn't, even though the
    # deploy itself would have succeeded via another node.
    # ⭐ Same disease as C4 in a place the C4 fix cannot reach. A genuinely single address
    # that survives node loss needs DNS or a VIP, i.e. infrastructure, not YAML. Phase 17.
    url: http://192.168.1.192:5001

  before_script:
    # The key goes into ssh-agent VIA STDIN and is never written to a file. It therefore
    # never appears in argv (world-readable via ps) and leaves nothing behind in the build
    # workspace. The agent signs challenges; the private key never leaves its memory.
    #
    # ⭐ Side benefit found the hard way (phase16 P4-F1): no key file means no key-file
    # PERMISSIONS. The project share is CIFS with file_mode=0775,nounix, where chmod 600
    # is a silent no-op, so `ssh -i` refuses the key outright. This pattern is immune.
    #
    # `tr -d '\r'` is not superstition: a key pasted through a browser textarea or an
    # editor that has met Windows arrives CRLF, and ssh then rejects it with
    # "error in libcrypto" — a message that names nothing relevant.
    - eval $(ssh-agent -s)
    - echo "$SWARM_SSH_KEY" | tr -d '\r' | ssh-add -
    # Lets ssh persist the host key for the life of the job, so connection 1 learns it and
    # the rest verify against it. See the StrictHostKeyChecking callout below.
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh

  script:
    # ---------------------------------------------------------------------------------
    # C4 fix — pick a manager that can ACTUALLY ACCEPT A DEPLOY, not merely one that
    # answers on port 22.
    #
    # ⭐ The probe is the whole point, and getting it wrong is the classic mistake.
    # `ping`, or a bare `ssh host true`, tests REACHABILITY — and reachability is not the
    # question being asked. A node can accept SSH while being a worker (no `docker node
    # ls`), or a manager whose cluster has LOST QUORUM, in which case the deploy fails
    # halfway through having already copied files. Drill C5 measured exactly that state:
    # SSH fine, `docker node ls` hanging until `context deadline exceeded`.
    #
    # `docker node ls` is therefore the honest probe. It returns 0 only from a manager
    # that can reach a Raft majority — which is precisely the capability the next 5
    # commands depend on. ⭐ Probe for the capability you are about to use, not for a
    # proxy that correlates with it.
    #
    # -o BatchMode=yes matters more than it looks: without it a key failure makes ssh
    # PROMPT FOR A PASSWORD, and in a CI job with no tty that either hangs the pipeline
    # or, worse, silently succeeds via a fallback we did not intend. That is finding
    # P4-F2, found by watching a local test go green for the wrong reason.
    #
    # -o ConnectTimeout=5 bounds each attempt. A powered-off node fails instantly
    # (EHOSTUNREACH), but a FIREWALLED one blackholes packets and would otherwise sit on
    # ssh's default ~2min timeout per host before trying the next.
    # ---------------------------------------------------------------------------------
    - |
      echo "==> choosing a deploy target from: $SWARM_HOSTS"
      SWARM_HOST=""
      for candidate in $SWARM_HOSTS; do
        printf '    %-15s ' "$candidate"
        if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 \
               "$SWARM_USER@$candidate" 'docker node ls >/dev/null 2>&1'; then
          echo "USABLE — reachable, a manager, and has quorum"
          SWARM_HOST="$candidate"
          break
        fi
        echo "unusable — skipping"
      done
      if [ -z "$SWARM_HOST" ]; then
        echo ""
        echo "FATAL: no manager can accept a deploy."
        echo "⭐ Read this failure carefully: it is NOT the C4 failure wearing a new hat."
        echo "   C4 was 'the one host I named is gone' — a wiring bug, fixable in this file."
        echo "   This is 'all three managers refused' — the CLUSTER is down, or quorum is"
        echo "   lost, and no amount of retrying the pipeline will change that."
        exit 1
      fi
      export SWARM_HOST
      echo "==> deploy target: $SWARM_HOST"

    # Reproduce the layout deploy_swarm.sh expects, then ship the two artefacts.
    # ⚠️ Deliberately NOT relying on the NAS share being mounted on the node, even though
    # it is: a deploy that depends on a shared mount deploys whatever happens to be on
    # someone's workstation, not what CI checked out of git.
    - ssh -o StrictHostKeyChecking=no "$SWARM_USER@$SWARM_HOST" "mkdir -p '$REMOTE_DIR/scripts' '$REMOTE_DIR/manifests'"
    - scp -o StrictHostKeyChecking=no education/docker-swarm/scripts/deploy_swarm.sh "$SWARM_USER@$SWARM_HOST:$REMOTE_DIR/scripts/"
    - scp -o StrictHostKeyChecking=no education/docker-swarm/manifests/capricorn.stack.yml "$SWARM_USER@$SWARM_HOST:$REMOTE_DIR/manifests/"

    # The token crosses on STDIN and is read into an environment variable on the far side.
    #
    # ⚠️ Why not the obvious `ssh host "REG_TOKEN=$REG_TOKEN bash ..."`: that expands the
    # token into the remote command line, where /proc/<pid>/cmdline is world-readable and
    # `ps` shows it to every user on the node for the life of the deploy. Read from stdin,
    # it reaches the script as ENVIRONMENT, and /proc/<pid>/environ is readable only by the
    # owner and root. GitLab masking hides a value in JOB LOGS and does nothing about
    # either of these.
    #
    # ⚠️ Honest limit: the lab registry is plain HTTP (ledger L1), so `docker login` puts
    # this token on the LAN in cleartext no matter how carefully it was handled at both
    # ends. Scoping it to read_registry (hard rule B6) limits what a captured token is
    # WORTH; it does not prevent the capture.
    - |
      echo "$REG_TOKEN" | ssh -o StrictHostKeyChecking=no "$SWARM_USER@$SWARM_HOST" \
        "read -r REG_TOKEN; export REG_TOKEN; export REG_USER='$REG_USER'; export REGISTRY='$REGISTRY'; bash '$REMOTE_DIR/scripts/deploy_swarm.sh'"
