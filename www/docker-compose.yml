version: '3.8'

services:
  webserver:
    image: nginx:alpine
    container_name: script-server
    ports:
      - "80:80"
    volumes:
      # Renamed Aug 21, 2026: ./scripts -> ./ubuntu and ./scripts_fedora -> ./fedora,
      # so the served URLs are /ubuntu/ and /fedora/. nginx.conf keeps 301s from the
      # old paths, because host_setup.sh copies already on built hosts have the old
      # SCRIPT_SERVER baked in.
      #
      # A sibling directory is invisible to nginx unless it is mounted too -- only
      # ./scripts was bind-mounted, so adding a second distro tree to the repo did
      # not make it servable until this second line existed.
      #
      # NOTE what is deliberately NOT here: www/ itself. The NAS credential file
      # lives at www/smb_credentials, one level above both trees, so the container
      # has no path to it at all. Do not add a `- .:/...` mount for convenience.
      - ./ubuntu:/usr/share/nginx/html/ubuntu:ro
      - ./fedora:/usr/share/nginx/html/fedora:ro
      # The landing page is mounted as a SINGLE FILE, not by mounting www/ as the
      # web root. Mounting the directory would be the obvious way to serve an
      # index.html and it would drag www/smb_credentials into the container with
      # it -- undoing the whole reason the credential file was moved up here.
      - ./index.html:/usr/share/nginx/html/index.html:ro
      # Added Nov 22, 2026 (Andrew): a general file drop served at /files/. It is a
      # SIBLING of the project, NOT inside it: cursor-projects/www-files, i.e.
      # ../../www-files relative to this file. Mounted READ-ONLY, so nothing here can
      # write to it, and ONLY that folder -- never its parent. Open guest access on
      # the LAN (no auth, no TLS): do not put anything in it you would not hand to
      # every device on the network. Not part of this repo, so not tracked.
      - ../../www-files:/usr/share/nginx/html/files:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Was `unless-stopped` until Nov 22, 2026. Docker starts such a container the instant
    # the daemon is up, which can beat the /mnt/DevShare CIFS mount that every bind
    # mount below lives on (nothing orders docker.service after that mount). The
    # container is now started at boot by /etc/systemd/system/script-server.service,
    # which waits for the mount plus 10 s. If that unit is ever removed, this
    # container will NOT come back after a reboot.
    restart: "no"

