server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    
    # Enable directory listing
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    
    location / {
        # Redirect root to /scripts
        return 301 /scripts/;
    }
    
    # The NAS credential file sits beside the scripts so a local repo clone can read
    # it without prompting. It is NOT downloaded by host_setup.sh, so serving it over
    # HTTP buys nothing and publishes the NAS password to anyone on the LAN.
    # Found Aug 20, 2026 while auditing the build path for the Jenkins VM.
    # An exact-match location wins over the /scripts/ prefix below.
    location = /scripts/smb_credentials {
        deny all;
    }

    location /scripts/ {
        alias /usr/share/nginx/html/scripts/;
        autoindex on;
    }
}

