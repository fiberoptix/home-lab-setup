server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Enable directory listing
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Emit RELATIVE Location headers. By default nginx rebuilds a redirect into an
    # absolute URL and drops a non-standard port while doing it: a request to
    # host:18101/scripts/host_setup.sh was answered with
    # `Location: http://localhost/ubuntu/host_setup.sh` -- port gone, so following
    # it left the server entirely and fetched whatever sits on port 80.
    # Measured Aug 21, 2026 while testing the rename redirects.
    #
    # Invisible in production, where this really is on port 80, which is exactly
    # what makes it worth turning off now rather than rediscovering it the first
    # time someone runs the script server on an alternate port.
    absolute_redirect off;

    # ---------------------------------------------------------------------
    # Landing page: www/index.html, bind-mounted as a single file.
    #
    # `index` wins over `autoindex`, so / serves the page and the two tree
    # locations below still list their directories for manual downloads.
    #
    # There are two equal distro trees, so redirecting / to one of them would be
    # an arbitrary choice that hides the other -- hence a real page.
    # ---------------------------------------------------------------------
    index index.html;

    location = / {
        # no-cache, not no-store: the browser may keep the file but MUST
        # revalidate before using it. With the ETag above that is a 304 and a few
        # bytes, and it fixes a real annoyance -- editing index.html and then
        # being served the old copy, which happened twice while writing it.
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # -------------------------------------------------------------------------
    # REPAIR FOR A CACHED 301. This is the interesting one.
    #
    # Until Aug 21, 2026 this file contained:
    #     location / { return 301 /scripts/; }
    # A 301 is PERMANENT and browsers cache it indefinitely -- frequently
    # surviving a hard reload, because the browser never asks about a permanent
    # redirect again. Every browser that ever visited the old script server
    # therefore still believes `/` means `/scripts/`, and with the compatibility
    # rules further down it lands on `/ubuntu/`: the user asks for the landing
    # page and silently gets the Ubuntu directory listing. Reported from a real
    # browser while `curl` on the same box showed a clean `200` for `/`, which is
    # exactly the signature of a client-side cached redirect.
    #
    # The server cannot invalidate it. What it CAN do is make the stale chain end
    # somewhere correct: bare `/scripts/` now serves the landing page, so the
    # cached hop `/` -> `/scripts/` arrives at the intended destination anyway.
    #
    # ⛔ The obvious alternative -- redirecting `/scripts/` back to `/` -- is an
    # INFINITE LOOP, because the browser's cached rule immediately sends `/` to
    # `/scripts/` again. Serving the content, rather than redirecting to it, is
    # what breaks the cycle.
    #
    # `=` is an exact match, which outranks the regex rules below, so this only
    # affects the bare directory. `/scripts/<file>` still redirects properly.
    # -------------------------------------------------------------------------
    location = /scripts/ {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /scripts_fedora/ {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # ---------------------------------------------------------------------
    # The NAS credential file is NOT in either tree -- it lives at
    # www/smb_credentials, which docker-compose deliberately does NOT mount, so
    # nginx has no path to it and autoindex cannot even list the name.
    #
    # This rule is the SECOND layer, for the case where a stray copy reappears
    # inside a tree. It is matched by NAME, and that is why the Aug 21, 2026
    # rename of /scripts/ -> /ubuntu/ and /scripts_fedora/ -> /fedora/ required
    # NO CHANGE HERE, while the three path-based rules it replaced would each
    # have silently stopped covering anything. That contrast is the whole
    # argument for name-based safety rules.
    #
    # Why this still beats the prefix locations below: nginx finds the LONGEST
    # MATCHING PREFIX first and remembers it, then tests regex locations in file
    # order, and a matching regex OVERRIDES the remembered prefix. It would NOT
    # beat `=` or `^~` on the same path, so do not add either of those below.
    #
    # NOTE: this denies by URI, BEFORE nginx resolves the path to a file, so it
    # returns 403 whether the file exists or not. Do not use 403-vs-404 to test
    # whether a copy is present -- check the directory listing instead.
    location ~ /smb_credentials$ {
        deny all;
    }

    # Ubuntu / Debian build standard  (phases/phase2_host_setup_automation.md)
    location /ubuntu/ {
        alias /usr/share/nginx/html/ubuntu/;
        autoindex on;
    }

    # Fedora build standard  (phases/phase2b_fedora_host_setup.md)
    location /fedora/ {
        alias /usr/share/nginx/html/fedora/;
        autoindex on;
    }

    # ---------------------------------------------------------------------
    # COMPATIBILITY REDIRECTS -- added with the rename on Aug 21, 2026.
    #
    # These paths are baked into things we cannot edit from here: the
    # SCRIPT_SERVER default inside host_setup.sh copies already sitting on every
    # built host, and the build commands recorded verbatim in eight phase files.
    # Both `wget` and `curl -fsSL` follow redirects, so old invocations keep
    # working instead of failing with a 404 that looks like the server is down.
    #
    # 301 is deliberate: it is the honest status for "this moved permanently",
    # and it makes the old name visible in logs so we can tell when it has
    # actually stopped being used. Safe to delete once that number is zero.
    #
    # These MUST be regex locations, not prefix locations. `$1` is a regex
    # capture: in a prefix location it is empty, so `location /scripts/` with
    # `return 301 /ubuntu/$1` would silently drop the filename and redirect
    # every request to the directory listing. Caught before it shipped, but only
    # because the redirect was actually exercised with a filename.
    #
    # They sit BELOW the smb_credentials rule on purpose: regex locations are
    # tested in file order, so a stray /scripts/smb_credentials is still denied
    # rather than redirected to a path where it might be served.
    # ---------------------------------------------------------------------
    # `Cache-Control: no-store` on the redirect itself, added Aug 21, 2026 after a
    # cached 301 on `/` caused exactly the confusion described above. wget and
    # curl -- the clients these rules actually exist for -- do not cache, so this
    # costs nothing; what it buys is that a BROWSER which wanders through here
    # cannot memorise the mapping and strand itself if these paths move again.
    # ⭐ A 301 is a promise you can never take back. Only make it to clients that
    # will not hold you to it.
    location ~ ^/scripts/(.*)$ {
        add_header Cache-Control "no-store" always;
        return 301 /ubuntu/$1$is_args$args;
    }

    location ~ ^/scripts_fedora/(.*)$ {
        add_header Cache-Control "no-store" always;
        return 301 /fedora/$1$is_args$args;
    }
}
